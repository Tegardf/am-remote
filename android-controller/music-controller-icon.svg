<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/>
      <stop offset="0.55" stop-color="#161618"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5A5A5E"/>
      <stop offset="1" stop-color="#D1D1D6"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BDBDC2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <ellipse cx="380" cy="120" rx="620" ry="300" fill="#FFFFFF" opacity="0.06"/>
  </g>

  <!-- Controller ring: track + level -->
  <path d="M335.2 646.8 A250 250 0 1 1 688.8 646.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="40" stroke-linecap="round"/>
  <path d="M335.2 646.8 A250 250 0 1 1 728.5 345" fill="none" stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="728.5" cy="345" r="14" fill="#FFFFFF"/>

  <!-- Knob -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="470" r="170" fill="url(#knob)"/>
  </g>
  <circle cx="512" cy="470" r="138" fill="none" stroke="#161618" stroke-opacity="0.12" stroke-width="6"/>
  <line x1="555.3" y1="445" x2="615.9" y2="410" stroke="#161618" stroke-width="24" stroke-linecap="round"/>

  <!-- Equalizer accent -->
  <g fill="#FFFFFF">
    <rect x="404" y="800" width="24" height="40" rx="12" opacity="0.7"/>
    <rect x="452" y="780" width="24" height="80" rx="12" opacity="0.85"/>
    <rect x="500" y="760" width="24" height="120" rx="12"/>
    <rect x="548" y="780" width="24" height="80" rx="12" opacity="0.85"/>
    <rect x="596" y="800" width="24" height="40" rx="12" opacity="0.7"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
